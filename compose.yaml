services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: college_events
      MYSQL_USER: college_app
      MYSQL_PASSWORD: local_app_password
      MYSQL_ROOT_PASSWORD: local_root_password
    volumes:
      - college_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: college_events
      DB_USER: college_app
      DB_PASS: local_app_password
    depends_on:
      db:
        condition: service_healthy
volumes:
  college_db:
